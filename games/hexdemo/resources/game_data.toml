# Declarative title data (mirrored into StateUpdate.turn_rules by the server).
# Manifest: games/hexdemo/hexengine_pack.toml → [gamedata] file = this path.

gamedata_schema = 1
max_active_units_per_hex = 3
movement_budget_attribute_key = "movement"
session_state_key = "hexdemo"
title_css_file = "ui.css"

[faction_display_names]
union = "Union"
confederate = "Confederate"

[faction_css_classes]
union = "union"
confederate = "confederate"

[hex_highlight_ui]
schema = 1
move_hex_class = "hexdemo-move-hex"
retreat_hex_class = "hexdemo-retreat-hex"
retreat_through_hex_class = "hexdemo-retreat-through-hex"
marker_hex_class = "hexdemo-marker-hex"

[shell_ui]
advance_turn_button_label = "End Phase"
disrupt_instead_label = "Disrupt instead of retreat"
disrupt_instead_title = "Mark the retreating stack disrupted and waive the mandatory retreat (CRT)."
combat_advance_label = "Advance"
combat_advance_title = "Advance into the vacated hex after the opponent retreats."
attack_planning_phases = ["Combat"]
attack_pick_target_status = "Combat: select target hex and attackers, then confirm."
attack_not_in_phase_status = "Attack planning is only available during Combat."
attack_target_set_status = "Target set — adjust attackers or confirm."
attack_confirm_label = "Confirm attack"
attack_cancel_label = "Cancel"
attack_plan_no_enemy_on_hex = "No enemy unit on that hex."
attack_plan_no_attackable_enemy = "No attackable enemy on that hex."
attack_plan_cannot_attack_target = "Cannot attack target."
combat_outcome_defender_destroyed = "Defender destroyed."
combat_outcome_none = "Combat resolved with no effect."
combat_outcome_resolved = "Combat resolved."
combat_retreat_required = "Mandatory retreat: move the unit one hex (exact distance)."
combat_retreat_wait = "Hold — waiting for the opponent's mandatory retreat."
combat_advance_prompt = "You may advance (click Advance)."
combat_advance_wait = "Waiting for the opponent to advance."
retreat_path_confirm_label = "Confirm retreat"
retreat_path_cancel_label = "Cancel path"
retreat_path_undo_label = "Undo hex"
retreat_path_pick_hex_status = "Retreat: click the next hex in your path."
retreat_path_ready_status = "Retreat path complete — confirm or undo."
place_marker_confirm_label = "Confirm move"
place_marker_cancel_label = "Cancel"
place_marker_pick_hex_status = "Shift+click marker, then click a destination hex."
place_marker_ready_status = "Destination set — confirm or pick another hex."
place_marker_invalid_status = "That hex is not a legal marker destination."
place_marker_pick_marker_status = "Select a marker to relocate."

[interaction_kind_styles]
error = "interaction-msg--error"
retreat = "interaction-msg--retreat"
advance = "interaction-msg--advance"
wait = "interaction-msg--wait"
phase = "interaction-msg--phase"
info = "interaction-msg--info"

# Browser client wiring (mirrored on turn_rules.client_contract).
[client_contract]
schema = 1

[[client_contract.select_modes]]
kind = "attack_plan"
apply_method = "_apply_attack_plan_preview"
draft_active_method = "_attack_plan_draft_active"
draft_presentation_id = "attack_draft"

[[client_contract.select_modes]]
kind = "retreat_path"
apply_method = "_apply_retreat_path_preview"
draft_active_method = "_retreat_path_draft_active"
draft_presentation_id = "retreat_path_draft"

[[client_contract.select_modes]]
kind = "place_marker"
apply_method = "_apply_place_marker_preview"
draft_active_method = "_place_marker_relocate_active"
draft_presentation_id = "place_marker_draft"

[[client_contract.panel_action_routes]]
mode = "local"
match_action_type = "AttackPlanCancel"
method = "cancel_attack_plan"

[[client_contract.panel_action_routes]]
mode = "local"
match_action_type = "RetreatPathCancel"
method = "cancel_retreat_path"

[[client_contract.panel_action_routes]]
mode = "local"
match_action_type = "RetreatPathUndo"
method = "undo_retreat_path_hex"

[[client_contract.panel_action_routes]]
mode = "local"
match_id = "retreat_path_confirm"
method = "confirm_retreat_path"

[[client_contract.panel_action_routes]]
mode = "local"
match_action_type = "PlaceMarkerCancel"
method = "cancel_place_marker"

[[client_contract.panel_action_routes]]
mode = "local"
match_id = "place_marker_confirm"
method = "confirm_place_marker"

[[client_contract.panel_action_routes]]
mode = "preview_commit"
match_action_type = "Attack"
wire_action_type = "Attack"
after_method = "cancel_attack_plan"
