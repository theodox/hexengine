# Declarative title data (mirrored into StateUpdate.turn_rules by the server).
# Manifest: games/hexdemo/hexengine_pack.toml → [gamedata] file = this path.

gamedata_schema = 1
max_active_units_per_hex = 3
movement_budget_attribute_key = "movement"
title_state_extension_key = "hexdemo"
title_css_file = "ui.css"

[faction_display_names]
union = "Union"
confederate = "Confederate"

[faction_css_classes]
