manifest_version = 1

[pack]
id = "hexdemo"
title = "Hexdemo"

[python]
# Pack root is `games/hexdemo`; importable top-level `hexdemo` package lives there.
# Prepend the `games` parent so `import hexdemo` resolves.
path_add = ".."
entry_module = "hexdemo.engine_entry"
entry_callable = "load_game_definition"

[gamedata]
file = "resources/game_data.toml"

[hooks.title_load]
module = "hexdemo.hooks.title_load"
splash_html = "splash.html"
splash_callable = "present_splash"
setup_callable = "run_setup"
server_loaded_callable = "on_server_loaded"
